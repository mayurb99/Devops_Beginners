# Lecture 8 — a dummy class token. Not an AWS key.
# stringData lets you type plain text. Kubernetes stores it base64.
# Base64 is encoding, not encryption. Anyone with kubectl can decode it.
# The HTML page and /health print this dummy value so you can see the app read it.
# A real app would not print a Secret. Never put AWS keys here.

apiVersion: v1
kind: Secret
metadata:
  name: notes-secret
type: Opaque   # generic key/value. Not a TLS cert, not a Docker login.
stringData:
  NOTES_TOKEN: "class-token-not-a-real-key"
